# 로컬 개발 및 CI 통합 테스트용 Docker Compose 구성.
# 로컬 전체 실행: docker compose up -d --build
# 로컬에서는 docker-compose.override.yml이 자동으로 함께 적용될 수 있다.
#
# 운영 EC2에서는 이 파일을 사용하지 않는다.
# 운영 배포: infra/deploy/compose.prod.yaml
# 배포 방식: GitHub Actions -> GHCR -> AWS SSM -> EC2
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?.env 에 MYSQL_ROOT_PASSWORD 를 설정하세요}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?.env 에 MYSQL_DATABASE 를 설정하세요}
      MYSQL_USER: ${MYSQL_USER:?.env 에 MYSQL_USER 를 설정하세요}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?.env 에 MYSQL_PASSWORD 를 설정하세요}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_REPORT_MODEL: ${OPENAI_REPORT_MODEL:-gpt-6-luna}
      REPORT_ALERT_WEBHOOK_URL: ${REPORT_ALERT_WEBHOOK_URL:-}
      ROOM_JOIN_BASE_URL: ${ROOM_JOIN_BASE_URL:-http://localhost:5173}

      # SCRUM-128: 청중 최초 입장의 중복 요청 처리
      # 실제 비밀키는 Git에 저장하지 않고 .env에서 주입한다.
      PARTICIPANT_JOIN_SECRET: ${PARTICIPANT_JOIN_SECRET:-}
      PARTICIPANT_SESSION_TTL: ${PARTICIPANT_SESSION_TTL:-PT24H}

      TZ: Asia/Seoul
    expose:
      - "8080"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql-data:
  redis-data:
