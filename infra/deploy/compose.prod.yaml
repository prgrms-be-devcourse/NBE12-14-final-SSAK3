# SCRUM-88: EC2 운영 환경
# GitHub Actions에서 빌드한 GHCR 이미지만 사용한다.
# MySQL과 Redis는 외부에 노출하지 않는다.
# 운영 비밀값은 환경변수로 주입한다.

name: react-app

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: Asia/Seoul

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    # GitHub Actions에서 게시한 이미지 사용
    # IMAGE_TAG에는 Git 커밋 SHA를 전달한다.
    image: ghcr.io/prgrms-be-devcourse/nbe12-14-final-ssak3-backend:${IMAGE_TAG:?IMAGE_TAG is required}

    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      # Spring 운영 프로파일
      SPRING_PROFILES_ACTIVE: prod

      # 리버스 프록시 전달 헤더 처리
      SERVER_FORWARD_HEADERS_STRATEGY: framework

      # MySQL
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      # Redis
      REDIS_HOST: redis

      # CORS 및 세션 쿠키
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}

      # 강연방 및 청중 인증
      ROOM_JOIN_BASE_URL: ${ROOM_JOIN_BASE_URL:?ROOM_JOIN_BASE_URL is required}
      PARTICIPANT_JOIN_SECRET: ${PARTICIPANT_JOIN_SECRET:?PARTICIPANT_JOIN_SECRET is required}
      PARTICIPANT_SESSION_TTL: ${PARTICIPANT_SESSION_TTL:-PT24H}

      # Gemini AI 설정
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_INPUT_USD_PER_MILLION_TOKENS: ${GEMINI_INPUT_USD_PER_MILLION_TOKENS:-}
      GEMINI_OUTPUT_USD_PER_MILLION_TOKENS: ${GEMINI_OUTPUT_USD_PER_MILLION_TOKENS:-}

      # 기타 LLM API
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      TZ: Asia/Seoul

    # Docker 내부 네트워크에서 접근
    expose:
      - "8080"

    # EC2 내부에서만 Health Check 접근 허용
    # 외부 인터넷에는 공개하지 않는다.
    ports:
      - "127.0.0.1:18080:8080"

  web:
    # GitHub Actions에서 게시한 프론트엔드 이미지
    image: ghcr.io/prgrms-be-devcourse/nbe12-14-final-ssak3-frontend:${IMAGE_TAG:?IMAGE_TAG is required}

    restart: unless-stopped

    depends_on:
      - backend

    # EC2 내부에서만 Health Check 접근 허용
    # 외부 요청은 Nginx Proxy Manager를 통해 전달한다.
    ports:
      - "127.0.0.1:18081:80"

  npm:
    # SCRUM-87: HTTPS 및 도메인 설정
    image: jc21/nginx-proxy-manager:2.17.1

    restart: unless-stopped

    depends_on:
      - web

    environment:
      TZ: Asia/Seoul

    # 관리자 포트(81)는 AWS 보안 그룹에서 접근을 제한한다.
    ports:
      - "80:80"
      - "443:443"
      - "81:81"

    # 프록시 설정 및 SSL 인증서 영속화
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt

volumes:
  mysql-data:
  redis-data:
  npm-data:
  npm-letsencrypt:
