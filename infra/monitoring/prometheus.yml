# SCRUM-91: Prometheus 모니터링 지표 수집 설정

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: re-act-report-results
    scrape_interval: 5s
    static_configs:
      - targets:
          - report-results:9108

  # 로컬 Spring Boot 애플리케이션 지표 수집
  - job_name: re-act-backend
    scrape_interval: 5s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080

  # MySQL 지표 수집 (mysqld-exporter)
  - job_name: re-act-mysql
    scrape_interval: 5s
    static_configs:
      - targets:
          - mysqld-exporter:9104
