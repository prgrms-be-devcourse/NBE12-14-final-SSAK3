# SCRUM-91: 로컬 모니터링 환경
# 기존 애플리케이션 Docker Compose와 분리하여 실행한다.

name: react-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --web.enable-remote-write-receiver

  # 완료된 회차의 k6·DB 검증 결과를 Prometheus에 제공한다.
  report-results:
    image: python:3.12-alpine
    restart: unless-stopped
    command: ["python", "-B", "/report_results.py", "--bind", "0.0.0.0"]
    read_only: true
    volumes:
      - ./report_results.py:/report_results.py:ro
      - ../../backend/build/reports/report-end:/reports:ro
      - ../../docs/experiments/report-end-load-2026-11-27.json:/baseline.json:ro

  # MySQL 지표(연결 수, 쿼리 수, InnoDB 락 대기). 접속 정보는 mysqld-exporter.my.cnf (예시 파일 참고)
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.17.2
    restart: unless-stopped

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./mysqld-exporter.my.cnf:/etc/mysqld-exporter/.my.cnf:ro

    command:
      - --config.my-cnf=/etc/mysqld-exporter/.my.cnf
      - --collect.info_schema.processlist
      - --collect.perf_schema.eventswaits

  grafana:
    image: grafana/grafana:13.3.0-ubuntu
    restart: unless-stopped

    depends_on:
      - prometheus

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - grafana-data:/var/lib/grafana

      # SCRUM-91: 데이터 소스 및 대시보드 자동 구성
      - ./grafana/datasource.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml:ro
      - ./grafana/dashboard.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./grafana/react-monitoring.json:/var/lib/grafana/dashboards/react-monitoring.json:ro
      - ./grafana/chat-load-test.json:/var/lib/grafana/dashboards/chat-load-test.json:ro
      - ./grafana/report-load-test.json:/var/lib/grafana/dashboards/report-load-test.json:ro

volumes:
  prometheus-data:
  grafana-data:
