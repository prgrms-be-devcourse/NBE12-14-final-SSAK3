# SCRUM-91: Grafana Prometheus 데이터 소스 자동 구성

apiVersion: 1

datasources:
  - name: RE:ACT Prometheus
    uid: react-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090

    # 기존 수동 등록 데이터 소스와 충돌하지 않도록 분리한다.
    isDefault: false
    editable: false

    jsonData:
      timeInterval: 15s
