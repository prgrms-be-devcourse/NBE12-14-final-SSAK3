plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.react'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'



    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
    inputs.property('runReportRestartTest', providers.environmentVariable('RUN_REPORT_RESTART_TEST').orElse('false'))
}

def reportLoadServer = tasks.register('reportLoadServer', JavaExec) {
    group = 'verification'
    description = 'Runs the local backend for the report-end k6 scenario.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.react.report.config.ReportLoadServer'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

tasks.register('prepareReportLoadLauncher') {
    group = 'verification'
    description = 'Writes the Java command for the managed local report load test.'
    dependsOn tasks.named('testClasses')
    def runDirectory = providers.gradleProperty('reportLoadDir')
    doLast {
        if (!runDirectory.isPresent()) throw new GradleException('Supply -PreportLoadDir=<run directory>.')
        def directory = file(runDirectory.get())
        directory.mkdirs()
        def server = reportLoadServer.get()
        def javaPath = server.javaLauncher.get().executablePath.asFile.absolutePath
        // A manifest keeps long classpaths and non-ASCII Windows paths off the command line.
        def manifest = new java.util.jar.Manifest()
        manifest.mainAttributes.putValue('Manifest-Version', '1.0')
        manifest.mainAttributes.putValue('Main-Class', server.mainClass.get())
        manifest.mainAttributes.putValue('Class-Path', server.classpath.files.collect { it.toURI().toASCIIString() }.join(' '))
        new File(directory, 'report-load.jar').withOutputStream { output ->
            new java.util.jar.JarOutputStream(output, manifest).close()
        }
        new File(directory, 'java-executable.txt').setText(javaPath, 'UTF-8')
    }
}
