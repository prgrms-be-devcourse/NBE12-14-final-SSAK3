# SCRUM-128 통합 테스트에서만 사용하는 고정 비밀키.
# 운영 환경에서는 이 값을 사용하지 않는다.
PARTICIPANT_JOIN_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

spring:
  config:
    import: optional:file:../.env.test[.properties]
  datasource:
    url: jdbc:mysql://${TEST_MYSQL_HOST:localhost}:${TEST_MYSQL_PORT:3306}/react_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: react_test
    password: ${TEST_MYSQL_PASSWORD}

    # 테스트 컨텍스트별 DB 커넥션 수를 제한한다.
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1

  flyway:
    # 통합 테스트에서는 각 테스트가 필요한 마이그레이션을 수행한다.
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
  data:
    redis:
      repositories:
        enabled: false

# 기존 기능 테스트에서는 운영 제한의 영향을 받지 않도록 한다.
# 운영 제한 전용 테스트에서는 실제 제한값을 별도로 설정한다.
app:
  limits:
    max-live-rooms: 2147483647
    max-live-rooms-per-host: 2147483647
    max-participants-per-room: 2147483647
