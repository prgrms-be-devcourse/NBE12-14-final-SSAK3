spring:
  config:
    import: optional:file:../.env.test[.properties]
  datasource:
    url: jdbc:mysql://${TEST_MYSQL_HOST:localhost}:${TEST_MYSQL_PORT:3306}/csmatch_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: csmatch_test
    password: ${TEST_MYSQL_PASSWORD}
  flyway:
    # 통합 테스트는 create-drop 으로 테이블을 만들고 지우므로 Flyway 이력과 어긋나지 않게 끈다
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
  data:
    redis:
      repositories:
        enabled: false

app:
  jwt:
    secret: "0123456789abcdef0123456789abcdef"
