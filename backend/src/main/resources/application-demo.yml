# 명시적으로 demo 프로파일을 선택한 경우에만 별도 DB와 예시 문제를 사용한다.
spring:
  config:
    import:
      - optional:file:./.env.demo[.properties]
      - optional:file:../.env.demo[.properties]
  datasource:
    url: jdbc:mysql://localhost:3307/csmatch_demo?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: csmatch_demo
    password: ${DEMO_MYSQL_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6380
  flyway:
    baseline-on-migrate: false
    locations: classpath:db/migration,classpath:db/demo
server:
  port: 8081
app:
  cors:
    allowed-origins: http://localhost:5174,http://127.0.0.1:5174
  jwt:
    secret: ${DEMO_JWT_SECRET}
