# 로컬 개발용: docker compose up -d mysql redis 로 띄운 DB·Redis(127.0.0.1)에 접속
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/${MYSQL_DATABASE:csmatch}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:csmatch}
    password: ${MYSQL_PASSWORD:change-me}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.csmatch: debug
