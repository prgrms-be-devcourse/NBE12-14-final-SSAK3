# 배포용(EC2, docker compose): 값은 전부 환경 변수로 주입하고 기본값을 두지 않는다
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  jpa:
    show-sql: false
    hibernate:
      # 테이블은 ERD 내보내기 SQL 로 직접 만들고, 엔티티와 일치하는지만 검사한다
      ddl-auto: validate

logging:
  level:
    com.csmatch: info
