# 공통 설정. 환경별 값은 application-local.yml / application-prod.yml 에 둔다.
spring:
  application:
    name: cs-match
  profiles:
    default: local
  jpa:
    hibernate:
      # 테이블은 ERD 내보내기 SQL로 직접 만들고, 엔티티와 일치하는지만 검사한다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
