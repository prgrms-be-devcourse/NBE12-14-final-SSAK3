# 공통 설정. 환경별 값은 application-local.yml / application-prod.yml 에 둔다.
spring:
  application:
    name: re-act
  profiles:
    default: local
  jpa:
    hibernate:
      # 테이블은 Flyway 마이그레이션(db/migration)으로 만들고, 엔티티와 일치하는지만 검사한다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul

# API 문서(Swagger UI)는 기본적으로 끈다. 로컬 프로파일에서만 켠다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  port: 8080
  shutdown: graceful
  servlet:
    session:
      cookie:
        name: HOST_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  # SCRUM-91: HTTP 요청 응답 시간의 백분위수 측정
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  ai:
    report:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_REPORT_MODEL:gpt-6-luna}
    audience:
      scheduler:
        fixed-delay: ${AI_ANALYSIS_SCHEDULER_DELAY:5000}
        recovery-fixed-delay: ${AI_ANALYSIS_RECOVERY_DELAY:60000}
        max-windows-per-run: ${AI_ANALYSIS_SCHEDULER_MAX_WINDOWS_PER_RUN:3}
        max-finalization-rooms-per-run: ${AI_FINALIZATION_MAX_ROOMS_PER_RUN:5}
        finalization-lease-duration: ${AI_FINALIZATION_LEASE_DURATION:90s}
        stale-analysis-threshold: ${AI_ANALYSIS_STALE_THRESHOLD:2m}
      gemini:
        api-key: ${GEMINI_API_KEY:}
        model: ${GEMINI_MODEL:}
        base-url: ${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
        connect-timeout: ${GEMINI_CONNECT_TIMEOUT:2s}
        read-timeout: ${GEMINI_READ_TIMEOUT:15s}
        max-messages: ${GEMINI_MAX_MESSAGES:100}
        max-input-characters: ${GEMINI_MAX_INPUT_CHARACTERS:32000}
        max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:2048}
        max-response-characters: ${GEMINI_MAX_RESPONSE_CHARACTERS:128000}
        pricing:
          # Gemini가 반환한 실제 토큰 사용량에만 적용하는 추정 단가다. 실제 청구 금액이 아니다.
          input-usd-per-million-tokens: ${GEMINI_INPUT_USD_PER_MILLION_TOKENS:}
          output-usd-per-million-tokens: ${GEMINI_OUTPUT_USD_PER_MILLION_TOKENS:}
      retry:
        max-retries: ${AI_GEMINI_MAX_RETRIES:1}
        retry-delay: ${AI_GEMINI_RETRY_DELAY:500ms}
        max-retry-after: ${AI_GEMINI_MAX_RETRY_AFTER:5s}
