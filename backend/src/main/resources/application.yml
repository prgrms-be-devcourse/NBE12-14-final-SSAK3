# 공통 설정. 환경별 값은 application-local.yml / application-prod.yml 에 둔다.
spring:
  application:
    name: cs-match
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
