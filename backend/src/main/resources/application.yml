# 공통 설정. 환경별 값은 application-local.yml / application-prod.yml 에 둔다.
spring:
  application:
    name: re-act
  profiles:
    default: local
  jpa:
    hibernate:
      # 테이블은 Flyway 마이그레이션(db/migration)으로 만들고, 엔티티와 일치하는지만 검사한다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul

server:
  port: 8080
  shutdown: graceful
  servlet:
    session:
      cookie:
        name: HOST_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
