# 공통 설정. 환경별 값은 application-local.yml / application-prod.yml 에 둔다.
spring:
  application:
    name: cs-match
  profiles:
    default: local
  jpa:
    hibernate:
      # 테이블은 Flyway 마이그레이션(db/migration)으로 만들고, 엔티티와 일치하는지만 검사한다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul
  flyway:
    # 이미 테이블이 있는 기존 DB(로컬·배포)는 V2(스키마+시드)까지 적용된 것으로 보고 V3부터 실행한다.
    baseline-on-migrate: true
    baseline-version: 2

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  llm:
    # 비어 있어도 서버는 기동한다. 문제 생성 API 만 503 LLM_NOT_CONFIGURED 를 돌려준다.
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:claude-sonnet-5-5}
    # 생성 요청이 고를 수 있는 모델(쉼표로 구분). 여기에 없는 모델은 호출 전에 400 으로 막는다. 기본 모델은 목록에 없어도 허용한다.
    models: ${LLM_MODELS:claude-haiku-5-5,claude-sonnet-5-5,claude-opus-5-5}
    # 한 번에 만들 수 있는 문제 수 상한과 문제 하나당 최대 시도 횟수 (비용 상한)
    max-count: 30
    max-attempts: 3
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}