# 공통 설정. 환경별 값은 application-local.yml / application-prod.yml 에 둔다.
spring:
  application:
    name: cs-match
  profiles:
    default: local
  jpa:
    hibernate:
      # 테이블은 Flyway 마이그레이션(db/migration)으로 만들고, 엔티티와 일치하는지만 검사한다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul
  flyway:
    # 이미 테이블이 있는 기존 DB(로컬·배포)는 V2(스키마+시드)까지 적용된 것으로 보고 V3부터 실행한다.
    baseline-on-migrate: true
    baseline-version: 2

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}