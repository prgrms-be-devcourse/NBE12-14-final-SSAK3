name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "EC2 배포 실행"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    name: Verify CI
    uses: ./.github/workflows/ci.yml

  # GHCR 이미지 게시 (SCRUM-88)
  publish-images:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs: [ci]
    if: >-
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.deploy == true &&
       github.ref == 'refs/heads/main')

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - component: backend
            context: ./backend
          - component: frontend
            context: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ghcr.io/prgrms-be-devcourse/nbe12-14-final-ssak3-${{ matrix.component }}:${{ github.sha }}

  # AWS SSM을 이용한 EC2 자동배포 (SCRUM-88)
  deploy-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [publish-images]

    # main Push 자동배포 또는 main 대상 수동 배포
    if: >-
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.deploy == true &&
       github.ref == 'refs/heads/main')

    # 여러 배포 작업의 동시 실행 방지
    concurrency:
      group: react-app-production-deploy
      cancel-in-progress: false

    permissions:
      contents: read

    timeout-minutes: 20

    env:
      AWS_REGION: ap-northeast-2
      EC2_INSTANCE_ID: i-0ee8e414fbadab01a

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          test -n "$AWS_REGION"
          test -n "$EC2_INSTANCE_ID"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]

          aws sts get-caller-identity \
            --query Account \
            --output text

      - name: Send deployment files and command via SSM
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          # 오래된 실행이 새 버전을 덮어쓰지 못하도록 전송 직전에 검사
          LATEST_SHA="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          if [[ -z "$LATEST_SHA" || "$LATEST_SHA" != "$GITHUB_SHA" ]]; then
            echo "배포 중단: 현재 실행 SHA가 원격 브랜치의 최신 SHA가 아닙니다." >&2
            exit 1
          fi

          # Git에 있는 배포 파일만 전달한다. 운영 비밀값은 포함하지 않는다.
          COMPOSE_B64="$(base64 -w 0 infra/deploy/compose.prod.yaml)"
          SCRIPT_B64="$(base64 -w 0 infra/deploy/deploy.sh)"
          COMPOSE_SHA="$(sha256sum infra/deploy/compose.prod.yaml | cut -d ' ' -f 1)"
          SCRIPT_SHA="$(sha256sum infra/deploy/deploy.sh | cut -d ' ' -f 1)"

          # 새 파일은 스테이징에만 저장한다.
          # 배포 성공 후 deploy.sh가 운영 파일로 확정한다.
          jq -n \
            --arg compose "$COMPOSE_B64" \
            --arg script "$SCRIPT_B64" \
            --arg compose_sha "$COMPOSE_SHA" \
            --arg script_sha "$SCRIPT_SHA" \
            --arg image_tag "$GITHUB_SHA" '
              def chunks: [range(0; length; 1500) as $i | .[$i:$i+1500]];
              def file($suffix): "/opt/react/.staging/" + $image_tag + $suffix;
              {
                commands: (
                  [
                    "set -eu",
                    "umask 077",
                    "install -d -m 700 -o root -g root /opt/react",
                    "install -d -m 700 -o root -g root /opt/react/.staging",
                    (": > " + file(".compose.b64")),
                    (": > " + file(".script.b64"))
                  ]
                  + ($compose | chunks | map("printf %s " + (. | @sh) + " >> " + file(".compose.b64")))
                  + ($script | chunks | map("printf %s " + (. | @sh) + " >> " + file(".script.b64")))
                  + [
                    ("base64 -d " + file(".compose.b64") + " > " + file(".compose.prod.yaml")),
                    ("base64 -d " + file(".script.b64") + " > " + file(".deploy.sh")),
                    ("echo " + $compose_sha + "  " + file(".compose.prod.yaml") + " | sha256sum -c -"),
                    ("echo " + $script_sha + "  " + file(".deploy.sh") + " | sha256sum -c -"),
                    ("chmod 600 " + file(".compose.prod.yaml")),
                    ("chmod 700 " + file(".deploy.sh")),
                    ("bash -n " + file(".deploy.sh")),
                    ("rm -f " + file(".compose.b64") + " " + file(".script.b64")),
                    ("bash " + file(".deploy.sh") + " " + $image_tag)
                  ]
                ),
                executionTimeout: ["900"]
              }' > ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "REACT deploy ${GITHUB_SHA}" \
            --parameters file://ssm-params.json \
            --timeout-seconds 120 \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command submitted: $COMMAND_ID"

      - name: Wait for deployment result
        shell: bash
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          set -euo pipefail

          # 최대 15분 동안 배포 결과 확인
          for attempt in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS:-Pending}"

            case "$STATUS" in
              Success)
                echo "EC2 deployment succeeded."
                exit 0
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                echo "EC2 deployment failed."
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Details:StatusDetails}' \
                  --output json
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "EC2 deployment status check timed out."
          exit 1
