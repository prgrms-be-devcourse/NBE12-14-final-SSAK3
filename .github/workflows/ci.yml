
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, chore/SCRUM-88-ghcr-image-publish]
  workflow_dispatch:
    inputs:
      deploy:
        description: "EC2 배포 실행"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# 같은 PR의 이전 CI 실행 취소 (배포 실행은 취소하지 않음)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: react_test
          MYSQL_USER: react_test
          MYSQL_PASSWORD: ci-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci-root-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_MYSQL_PASSWORD: ci-test-only

      # SCRUM-128: CI 테스트 전용 비밀키 (운영 사용 금지)
      PARTICIPANT_JOIN_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Initialize test databases
        run: docker exec -i -e MYSQL_PWD=ci-root-only ${{ job.services.mysql.id }} mysql -uroot < ../docs/db/init-test-databases.sql

      - name: Build and Test
        run: ./gradlew build --no-daemon

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Test STT behavior
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test STT browser integration
        run: npm run test:e2e

      - name: Build
        run: npm run build

  # Docker Compose 전체 실행 검증 (SCRUM-88)
  compose-smoke:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest

    env:
      MYSQL_ROOT_PASSWORD: ci-smoke-root
      MYSQL_DATABASE: react
      MYSQL_USER: react
      MYSQL_PASSWORD: ci-smoke-password

      # SCRUM-128: 임시 CI 환경에서만 사용하는 비밀키
      PARTICIPANT_JOIN_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      PARTICIPANT_SESSION_TTL: PT24H

    steps:
      - uses: actions/checkout@v4

      - name: Start Docker Compose
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Check Services
        run: |
          curl --retry 30 --retry-all-errors --retry-delay 3 -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'
          curl -fsS http://localhost/ -o /dev/null

      - name: Show Logs on Failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Cleanup
        if: always()
        run: docker compose down

  # GHCR 이미지 게시 (SCRUM-88)
  publish-images:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs: [backend, frontend, compose-smoke]
    if: >-
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/chore/SCRUM-88-ghcr-image-publish')) ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.deploy == true &&
       (github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/chore/SCRUM-88-ghcr-image-publish'))

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - component: backend
            context: ./backend
          - component: frontend
            context: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ghcr.io/prgrms-be-devcourse/nbe12-14-final-ssak3-${{ matrix.component }}:${{ github.sha }}

  # AWS SSM을 이용한 EC2 자동배포 (SCRUM-88)
  deploy-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [publish-images]

    # main push에서 자동배포, 작업 브랜치는 수동 실행만 허용
    if: >-
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.deploy == true &&
       (github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/chore/SCRUM-88-ghcr-image-publish'))

    # 여러 배포 작업의 동시 실행 방지
    concurrency:
      group: react-app-production-deploy
      cancel-in-progress: false

    permissions:
      contents: read

    timeout-minutes: 20

    env:
      AWS_REGION: ap-northeast-2
      EC2_INSTANCE_ID: i-0ee8e414fbadab01a

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          test -n "$AWS_REGION"
          test -n "$EC2_INSTANCE_ID"

          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]

          aws sts get-caller-identity \
            --query Account \
            --output text

      - name: Send deployment command via SSM
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          # 비밀값은 전달하지 않고 배포할 이미지의 SHA만 전달
          jq -n \
            --arg command "/opt/react/deploy.sh ${GITHUB_SHA}" \
            '{
              commands: [$command],
              executionTimeout: ["900"]
            }' > ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "REACT deploy ${GITHUB_SHA}" \
            --parameters file://ssm-params.json \
            --timeout-seconds 120 \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command submitted: $COMMAND_ID"

      - name: Wait for deployment result
        shell: bash
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          set -euo pipefail

          # 최대 15분 동안 배포 결과 확인
          for attempt in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS:-Pending}"

            case "$STATUS" in
              Success)
                echo "EC2 deployment succeeded."
                exit 0
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                echo "EC2 deployment failed."
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Details:StatusDetails}' \
                  --output json
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "EC2 deployment status check timed out."
          exit 1
